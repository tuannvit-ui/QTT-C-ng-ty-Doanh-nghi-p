<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Công Khai Quan Trắc Môi Trường</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0f172a; color: #ffffff; padding: 15px; }
        .header { text-align: center; background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #334155; }
        .header h1 { font-size: 1.4rem; color: #38bdf8; margin-bottom: 10px; text-transform: uppercase; }
        .status-bar { display: flex; justify-content: space-between; font-size: 0.85rem; color: #94a3b8; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .card { background: #1e293b; padding: 15px; border-radius: 8px; border-left: 5px solid #38bdf8; }
        .card-title { font-size: 0.9rem; color: #cbd5e1; font-weight: bold; }
        .card-value { font-size: 1.8rem; font-weight: bold; color: #4ade80; margin: 10px 0; }
        .card-unit { font-size: 0.9rem; color: #94a3b8; font-weight: normal; }
        .card-status { display: inline-block; background: #166534; color: #4ade80; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .loading { text-align: center; padding: 30px; color: #38bdf8; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="header">
        <h1>BẢNG CÔNG KHAI THÔNG SỐ QUAN TRẮC MÔI TRƯỜNG</h1>
        <div class="status-bar">
            <span id="status">Đang tải dữ liệu...</span>
            <span id="updated">Cập nhật: --:--</span>
        </div>
    </div>

    <div id="content" class="grid">
        <div class="loading">Đang kết nối hệ thống...</div>
    </div>

    <script>
        const API_TOKEN = "f6401302-6f65-48aa-8054-63429daad20d";
        const API_URL = "https://haiphong-envisoft.tedp.vn/api/partner/v1/announce-waste-hour";

        async function loadData() {
            try {
                const now = new Date();
                const yesterday = new Date(now.getTime() - (24 * 60 * 60 * 1000));
                
                const fromStr = yesterday.toISOString().split('.')[0];
                const toStr = now.toISOString().split('.')[0];

                const response = await fetch(`${API_URL}?page=0&size=100&apiType=7&from=${fromStr}&to=${toStr}&access_token=${API_TOKEN}`);
                const res = await response.json();
                
                const container = document.getElementById('content');
                container.innerHTML = '';

                const items = res.data || res.content || [];
                if(items.length === 0) {
                    container.innerHTML = '<div class="loading">Hiện chưa có dữ liệu quan trắc mới.</div>';
                    return;
                }

                items.forEach(item => {
                    container.innerHTML += `
                        <div class="card">
                            <div class="card-title">${item.stationName || 'Trạm Quan Trắc'} - ${item.parameterName || item.symbol || 'Thông số'}</div>
                            <div class="card-value">${item.value !== undefined ? item.value : '-'} <span class="card-unit">${item.unit || ''}</span></div>
                            <span class="card-status">${item.status || 'Đạt chuẩn'}</span>
                        </div>
                    `;
                });

                document.getElementById('status').innerText = "Trạng thái: Đã kết nối thành công";
                document.getElementById('status').style.color = "#4ade80";
                document.getElementById('updated').innerText = `Cập nhật: ${now.toLocaleTimeString('vi-VN')}`;

            } catch (err) {
                document.getElementById('status').innerText = "Trạng thái: Không thể lấy dữ liệu";
                document.getElementById('status').style.color = "#f87171";
            }
        }

        loadData();
        setInterval(loadData, 300000); // Tự động cập nhật mỗi 5 phút
    </script>
</body>
</html>
