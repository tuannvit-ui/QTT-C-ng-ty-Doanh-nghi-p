<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Công Khai Quan Trắc Môi Trường</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0f172a; color: #ffffff; padding: 15px; }
        .header { text-align: center; background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #334155; }
        .header h1 { font-size: 1.3rem; color: #38bdf8; margin-bottom: 10px; text-transform: uppercase; }
        .status-bar { display: flex; justify-content: space-between; font-size: 0.85rem; color: #94a3b8; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .card { background: #1e293b; padding: 15px; border-radius: 8px; border-left: 5px solid #38bdf8; border-top: 1px solid #334155; border-right: 1px solid #334155; border-bottom: 1px solid #334155; }
        .card-title { font-size: 0.9rem; color: #cbd5e1; font-weight: bold; }
        .card-value { font-size: 1.8rem; font-weight: bold; color: #4ade80; margin: 10px 0; }
        .card-unit { font-size: 0.9rem; color: #94a3b8; font-weight: normal; }
        .card-status { display: inline-block; background: #166534; color: #4ade80; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .loading { text-align: center; padding: 30px; color: #38bdf8; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="station-title">BẢNG CÔNG KHAI THÔNG SỐ QUAN TRẮC MÔI TRƯỜNG</h1>
        <div class="status-bar">
            <span id="status">Đang kết nối hệ thống...</span>
            <span id="updated">Cập nhật: --:--</span>
        </div>
    </div>

    <div id="content" class="grid">
        <div class="loading">Đang tải dữ liệu từ máy chủ Sở TN&MT...</div>
    </div>

    <script>
        const API_TOKEN = "f6401302-6f65-48aa-8054-63429daad20d";
        const BASE_API_URL = "https://haiphong-envisoft.tedp.vn/api/partner/v1/announce-waste-hour";

        // Nhập Mã Trạm hoặc Tên Trạm muốn lọc (Để trống "" nếu muốn hiển thị tất cả các trạm)
        const TARGET_STATION = ""; 

        async function loadData() {
            const statusElem = document.getElementById('status');
            const updatedElem = document.getElementById('updated');
            const container = document.getElementById('content');

            try {
                const now = new Date();
                const yesterday = new Date(now.getTime() - (24 * 60 * 60 * 1000));
                
                // Định dạng thời gian YYYY-MM-DDTHH:mm:ss
                const fromStr = yesterday.toISOString().split('.')[0];
                const toStr = now.toISOString().split('.')[0];

                const targetUrl = `${BASE_API_URL}?page=0&size=100&apiType=7&from=${fromStr}&to=${toStr}&access_token=${API_TOKEN}`;
                
                // Sử dụng CORS Proxy công khai để tránh bị chặn kết nối từ trình duyệt
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

                let response = await fetch(proxyUrl);
                
                if (!response.ok) {
                    // Thử kết nối trực tiếp nếu proxy không khả dụng
                    response = await fetch(targetUrl);
                }

                if (!response.ok) throw new Error(`HTTP code: ${response.status}`);

                const res = await response.json();
                container.innerHTML = '';

                let items = res.data || res.content || res.result || [];

                // Lọc dữ liệu theo trạm nếu có thiết lập TARGET_STATION
                if (TARGET_STATION.trim() !== "") {
                    items = items.filter(item => {
                        const stName = (item.stationName || "").toLowerCase();
                        const stCode = (item.stationCode || "").toLowerCase();
                        const target = TARGET_STATION.toLowerCase();
                        return stName.includes(target) || stCode.includes(target);
                    });
                }

                if (items.length === 0) {
                    container.innerHTML = '<div class="loading">Hiện chưa có dữ liệu quan trắc trong thời gian này.</div>';
                    statusElem.innerText = "Trạng thái: Không có dữ liệu mới";
                    statusElem.style.color = "#f9e2af";
                    return;
                }

                // Cập nhật tiêu đề nếu có lọc trạm
                if (TARGET_STATION.trim() !== "" && items[0].stationName) {
                    document.getElementById('station-title').innerText = `QUAN TRẮC MÔI TRƯỜNG - ${items[0].stationName}`;
                }

                items.forEach(item => {
                    const title = item.parameterName || item.symbol || item.stationName || 'Thông số';
                    const val = item.value !== undefined ? item.value : '-';
                    const unit = item.unit || '';
                    const stt = item.status || 'Đạt chuẩn';

                    container.innerHTML += `
                        <div class="card">
                            <div class="card-title">${title}</div>
                            <div class="card-value">${val} <span class="card-unit">${unit}</span></div>
                            <span class="card-status">${stt}</span>
                        </div>
                    `;
                });

                statusElem.innerText = "Trạng thái: Đã kết nối thành công";
                statusElem.style.color = "#4ade80";
                updatedElem.innerText = `Cập nhật: ${now.toLocaleTimeString('vi-VN')} - ${now.toLocaleDateString('vi-VN')}`;

            } catch (err) {
                console.error("Lỗi kết nối:", err);
                statusElem.innerText = "Trạng thái: Không thể kết nối API";
                statusElem.style.color = "#f87171";
                container.innerHTML = '<div class="loading" style="color: #f87171;">Không thể kết nối đến máy chủ quan trắc. Vui lòng kiểm tra lại sau.</div>';
            }
        }

        loadData();
        setInterval(loadData, 300000); // Tự động làm mới dữ liệu sau mỗi 5 phút
    </script>
</body>
</html>
